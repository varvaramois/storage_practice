<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoes</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="product__basket">
        <h3 class="basket__title">product basket</h3>
    </div>
    <div class="container">
        <ul class="shoes__list">
            <li class="shoes__item">
                <h2 class="shoes__title">Running shoes</h2>
                <img src="https://i.ebayimg.com/images/g/JMQAAOSwW1dmudFt/s-l1200.jpg" alt="running_shoes" class="shoes__img">
                <p class="shoes__text">Lightweight and comfortable sneakers for everyday training.</p>
                <p class="shoes__price">32$</p>
                <button type="button" class="order__btn">Order now!</button>
            </li>
            <li class="shoes__item">
                <h2 class="shoes__title">Casual sneakers</h2>
                <img src="https://cdn.konopkashoes.com/pl/36829/kolorowe-sneakersy-the-james.png?class=mediumdefault" alt="casual_sneakers" class="shoes__img">
                <p class="shoes__text">Stylish sneakers that will suit any look.</p>
                <p class="shoes__price">40$</p>
                <button type="button" class="order__btn">Order now!</button>
            </li>
            <li class="shoes__item">
                <h2 class="shoes__title">Winter boots</h2>
                <img src="https://baccabucci.com/cdn/shop/products/MG_5242.jpg?v=1633514122" alt="winter_boots" class="shoes__img">
                <p class="shoes__text">Warm and waterproof boots for the cold season.</p>
                <p class="shoes__price">27$</p>
                <button type="button" class="order__btn">Order now!</button>
            </li>
        </ul>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
